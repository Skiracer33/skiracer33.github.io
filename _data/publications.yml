- title: A Knowledge Graph-Enhanced Tensor Factorisation Model for Discovering Drug Targets
  authors: Cheng Ye, Rowan Swiers, Stephen Bonner and Ian Barrett
  date: '20 May 2021'
  category: graphs
  topic: Knowledge graphs
  venue: IEEE/ACM TCBB
  summary: Combines tensor factorisation with knowledge graph embeddings to predict clinical outcomes for unseen gene–disease pairs. Adding learned gene representations improves prediction accuracy, with a joint neural-network and tensor model outperforming the evaluated baselines.
  arxiv: '2105.10578'
- title: 'A Review of Biomedical Datasets Relating to Drug Discovery: A Knowledge Graph Perspective'
  authors: Stephen Bonner, Ian P Barrett, Cheng Ye, Rowan Swiers, Ola Engkvist, Andreas Bender, Charles Tapley Hoyt and William L Hamilton
  date: '19 Feb 2021'
  category: graphs
  topic: Knowledge graphs
  venue: Briefings in Bioinformatics
  summary: A guide to public biomedical data for building drug-discovery knowledge graphs. The review categorises data sources, compares existing graphs and examines practical challenges and future research directions for applying graph-based machine learning in this domain.
  arxiv: '2102.10062'
- title: Handling missing data, censored values and measurement error in machine learning models using multiple imputation for early stage drug discovery
  authors: Rowan Swiers
  date: '2019'
  category: imputation
  topic: Missing data
  venue: StanCon 2019 · Cambridge
  status: Presentation
  summary: Explores how multiple imputation handles missing values, censoring and measurement error in early-stage drug discovery. Using simulated drug-discovery datasets, Python and Stan, the work compares imputation approaches and examines their effects on uncertainty estimates and investment decisions.
