- title: Designing an Interpretable Interface for Contextual Bandits
  authors: Andrew Maher, Matia Gobbo, Lancelot Lachartre, Subash Prabanantham, Rowan Swiers and Puli Liyanagama
  date: '23 Sep 2024'
  category: bandits
  topic: Contextual bandits
  venue: IntRS · RecSys 2024
  summary: An interface that helps domain experts understand and manage contextual bandits. A “value gain” metric explains the impact of individual components, while a qualitative user study explores how to make these systems accessible to non-experts.
  arxiv: '2409.15143'
- title: Batched Online Contextual Sparse Bandits with Sequential Inclusion of Features
  authors: Rowan Swiers, Subash Prabanantham and Andrew Maher
  date: '13 Sep 2024'
  category: bandits
  topic: Contextual bandits
  venue: CONSEQUENCES · RecSys 2024
  summary: Introduces OBSI, an algorithm that adds features to a batched contextual bandit only as evidence of their relevance grows. Synthetic experiments show improvements in regret, feature relevance and computational cost, helping keep irrelevant features out of decisions.
  arxiv: '2409.09199'
- title: Understanding the Performance of Knowledge Graph Embeddings in Drug Discovery
  authors: Stephen Bonner, Ian P Barrett, Cheng Ye, Rowan Swiers, Ola Engkvist, Charles Tapley Hoyt and William L Hamilton
  date: '2022'
  preprint_date: '17 May 2021'
  category: graphs
  topic: Knowledge graphs
  venue: 'Artificial Intelligence in the Life Sciences 2 (2022): 100036'
  journal_url: https://doi.org/10.1016/j.ailsci.2022.100036
  summary: Thousands of experiments examine five embedding models on two drug-discovery knowledge graphs. Training choices, hyperparameters, random seeds and data splits can change both performance and model rankings, highlighting the need for reproducible, carefully reported comparisons.
  arxiv: '2105.10488'
- title: Disease ontologies for knowledge graphs
  authors: Natalja Kurbatova and Rowan Swiers
  date: '21 Jul 2021'
  category: graphs
  topic: Knowledge graphs
  venue: BMC Bioinformatics
  summary: A tool for cross-referencing disease ontologies and moving between their hierarchies to support knowledge graph data integration.
