- title: 'Cascaded Bid Floors for Heavy-Tailed Mobile Ad Auctions: A Deployed Production System'
  authors: Rowan Swiers, Yash Jain, Ajinkya Jawale and Andrew Maher
  date: '2026'
  category: auctions
  topic: Ad auctions
  venue: AdKDD at KDD 2026
  status: Not yet on arXiv
  summary: A production system for setting bid floors in mobile ad auctions with heavy-tailed bids. The accompanying FloorGym simulator studies cascades that pair a primary floor with a safety floor and compares their revenue and fill-rate trade-offs.
